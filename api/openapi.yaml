openapi: "3.0.3"
info:
  title: "Skynapi"
  description: "City search and weather cache API backed by Geonames and api.met.no"
  version: "1.0.0"
  contact:
    email: "met_no@jvanrhyn.co.za"

servers:
  - url: "http://localhost:8080/v1"
    description: "Local development"

paths:
  /cities:
    get:
      summary: "Search cities by name"
      description: |
        Performs a fuzzy search across city name and ASCII name. Results are
        ranked by trigram similarity weighted by population, so a strong match
        on a well-known city outranks an exact match on a same-named hamlet.
        Supports pagination.
      operationId: "searchCities"
      parameters:
        - name: q
          in: query
          required: true
          description: "Search term (2–100 characters)"
          schema:
            type: string
            minLength: 2
            maxLength: 100
          example: "amsterdam"
        - name: page
          in: query
          required: false
          description: "Page number (1-based)"
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: "Results per page"
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "Paginated list of matching cities"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitySearchResult"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /weather:
    get:
      summary: "Get weather for coordinates"
      description: |
        Returns a cached weather forecast from api.met.no for the given coordinates.
        Coordinates are normalised to 4 decimal places before cache lookup.
        Falls back to stale cache if the upstream API is temporarily unavailable;
        `X-Weather-Source` says which of the three happened.

        Send back the `ETag` from a previous response as `If-None-Match` to get
        a `304` instead of the full payload when nothing has changed.
      operationId: "getWeather"
      parameters:
        - name: lat
          in: query
          required: true
          description: "Latitude (-90 to 90)"
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 52.3676
        - name: lon
          in: query
          required: true
          description: "Longitude (-180 to 180)"
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: 4.9041
        - name: If-None-Match
          in: header
          required: false
          description: "ETag from a previous response; a match yields 304"
          schema:
            type: string
      responses:
        "200":
          description: "Weather forecast (api.met.no compact/2.0 format)"
          headers:
            ETag:
              description: "Weak validator for the response body"
              schema: { type: string }
            Cache-Control:
              description: "public, max-age until the upstream forecast expires; no-cache when stale"
              schema: { type: string }
            X-Weather-Cached-At:
              description: "When this forecast was stored, in HTTP-date format"
              schema: { type: string }
            X-Weather-Source:
              description: |
                Where the payload came from: `upstream` (freshly fetched),
                `cache` (fresh or revalidated) or `stale-cache` (upstream was
                unreachable, this is the last forecast we stored).
              schema:
                type: string
                enum: ["upstream", "cache", "stale-cache"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/METResponse"
        "304":
          description: "The client's cached copy is still current"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /reverse:
    get:
      summary: "Resolve coordinates to a place name"
      description: |
        Reverse-geocodes a coordinate through Nominatim and caches the answer.
        Proxied rather than called from the browser so the request carries the
        identifying User-Agent Nominatim's usage policy requires, and so a
        user's exact position is not sent to a third party: coordinates are
        rounded to 2 decimal places (~1.1 km) before they leave this service.
      operationId: "reverseGeocode"
      parameters:
        - name: lat
          in: query
          required: true
          description: "Latitude (-90 to 90)"
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: -26.2041
        - name: lon
          in: query
          required: true
          description: "Longitude (-180 to 180)"
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: 28.0473
      responses:
        "200":
          description: "Resolved place"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  schemas:
    Place:
      type: object
      properties:
        label:
          type: string
          description: "Display name, city and country joined"
          example: "Johannesburg, South Africa"
        city:
          type: string
          example: "Johannesburg"
        country:
          type: string
          example: "South Africa"
        country_code:
          type: string
          description: "ISO 3166-1 alpha-2"
          example: "ZA"

    City:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: "Geonames ID"
        name:
          type: string
        country:
          type: string
          description: "ISO 3166-1 alpha-2 country code"
          example: "NL"
        region:
          type: string
          description: "Administrative region (admin1 code)"
          example: "NH"
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        timezone:
          type: string
          example: "Europe/Amsterdam"

    CitySearchResult:
      type: object
      properties:
        cities:
          type: array
          items:
            $ref: "#/components/schemas/City"
        total:
          type: integer
          description: "Total matching cities across all pages"
        page:
          type: integer
        limit:
          type: integer

    METResponse:
      type: object
      description: "api.met.no locationforecast/2.0/compact response"
      properties:
        type:
          type: string
          example: "Feature"
        geometry:
          type: object
          properties:
            type:
              type: string
            coordinates:
              type: array
              items:
                type: number
        properties:
          type: object
          properties:
            meta:
              type: object
              properties:
                updated_at:
                  type: string
                  format: date-time
            timeseries:
              type: array
              items:
                type: object

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "validation failed"
        details:
          type: string

  responses:
    ValidationError:
      description: "Request validation failed"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    InternalError:
      description: "Internal server error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamUnavailable:
      description: "Upstream weather API unavailable and no cache available"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
